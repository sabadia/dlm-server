hooks:
  check: true
check:
  min_lines: 30
  ignore:
  - go.sum
  - '*.lock'
  - .intentline/**
  - '*generated*'
  - internal/storage/sqlite/db/**
  - .claude/skills/**
  - .agents/skills/**
  - .github/skills/**
